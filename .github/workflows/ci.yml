name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install authoring dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and package
        run: python scripts/validate.py --package
      - name: Test authoring helpers
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Scan authoring Python
        run: bandit -q -r scripts
      - name: Check whitespace
        run: git diff --check
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          expected=$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          echo "$expected  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1
